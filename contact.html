<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta name="description" content="Mozliwość kontaktu z Alicja">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Moje porfolio</title>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styl.css">
    </head>
    <body>

        <header class="site-header">
            <div class="container header-inner">
                <h1 class="logo"> Alicja Sieradzka</h1>

                <button id="menu-toggle" class="menu-btn" aria-label="Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

                <nav id="nav-menu">
                    <ul class="nav-list">
                        <li><a href="index.html">O mnie</a> </li>
                        <li><a href="galety.html">Hobby</a> </li>
                        <li><a href="cv.html">Działalność</a> </li>
                        <li><a href="contact.html" class="active">Kontakt</a> </li>
                    </ul>
                </nav>
                <button id="theme-toggle" class="btn-secondary">Motyw</button>
            </div>
        </header>

        <main class="container">

            <section class="contact-section">

                <h2>Napisz do mnie</h2>
                <p>Masz pytania, chcesz nawiązać współprace albo po prostu porozmawiać? Wypełnij formularz poniżej</p>
                
                <form action="#" method="POST" class="contact-form">

                    <div class="form-group">
                        <label for="email">Wpisz Twój email:</label>
                        <input type="email" id="email" name="email" placeholder="twoj@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="subject">Temat wiadomości:</label>
                        <select id="subject" name="subject" required>
                            <option value="" disabled selected>Wybierz temat</option>
                            <option value="współpraca">Współpraca</option>
                            <option value="pytanie">Pytanie ogólne</option>
                            <option value="inne">Inne</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">Treść wiadomości:</label>
                        <textarea id="message" name="message" rows="5" placeholder="Wpisz swoją wiadomość tutaj....." required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">Wyślij wiadomość</button>
                </form>

            </section>
        </main>

        <footer class="site-footer">
            <div class="container">
                <p>&copy; 2026 Alicja Sieradzka</p>
            </div>
        </footer>

        <script src="ss.js"></script>

    </body>
</html>
